<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Roda · Admin</title>
<link rel="icon" href="logo.png" type="image/png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#050508;--side:#08080d;--panel:#0d0d15;--ink:#e8e8f4;--muted:#80809f;--brand:#8b73ff;--line:#1a1a2b;--bad:#ff6b9a;--ok:#4cd9a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--side)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1.5px solid var(--line)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hide{display:none!important}
.err{color:var(--bad);min-height:1.3em;margin:6px 0}.err.ok{color:var(--ok)}.hint{color:var(--muted)}
.box{width:min(380px,92%);margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.box h1{margin:0 0 14px}.box input{margin-bottom:10px}
#panel{max-width:820px;margin:0 auto;padding:20px 16px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.bar h1{margin:0 auto 0 0;font-size:1.3rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--brand);background:#171436}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.item .nm{flex:1;min-width:140px;overflow-wrap:anywhere}.item .nm b{display:block}.item .nm small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 10px;font-size:.78rem;font-weight:800;background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.chip.act{color:var(--c);border-color:var(--c)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(440px,92%)}
dialog::backdrop{background:rgba(0,0,5,.75)}
label{display:block;font-weight:600;margin:12px 0 4px}.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
</style>
</head>
<body>

<div class="box" id="login">
  <h1>Roda · Admin</h1>
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
  <p class="err" id="lerr" role="alert"></p>
  <button id="go" style="width:100%">Entrar</button>
</div>
<div class="box hide" id="denied">
  <h1>Sem acesso</h1><p class="hint">Esta conta não tem a tag de ADM.</p>
  <button class="ghost" id="out2" style="width:100%">Sair</button>
</div>

<div id="panel" class="hide">
  <div class="bar"><h1>Roda · Admin</h1><button class="ghost" id="out">Sair</button></div>
  <div class="tabs">
    <button data-t="users" aria-pressed="true">Pessoas</button>
    <button data-t="groups" aria-pressed="false">Grupos</button>
    <button data-t="chat" aria-pressed="false">Chat global</button>
    <button data-t="news" aria-pressed="false">Anúncios</button>
  </div>
  <input id="search" placeholder="Buscar pessoa pelo nome de usuário" aria-label="Buscar pessoa">
  <p class="err" id="perr" role="alert"></p>
  <div id="list"></div>
</div>

<dialog id="edlg">
  <h2 style="margin-top:0" id="edtitle">Editar pessoa</h2>
  <label for="edname">Nome de usuário</label><input id="edname" maxlength="20">
  <label for="edstatus">Status</label><input id="edstatus" maxlength="60">
  <label for="edbio">Bio</label><textarea id="edbio" rows="3" maxlength="200"></textarea>
  <label class="chk"><input type="checkbox" id="eddrop"> Remover foto de perfil</label>
  <label class="chk"><input type="checkbox" id="edstyle"> Resetar cor, efeito, banner e tema</label>
  <p class="err" id="ederr" role="alert"></p>
  <div class="row"><button class="ghost" id="edcancel">Cancelar</button><button id="edsave">Salvar</button></div>
</dialog>

<script>
// Use a chave PUBLICÁVEL (sb_publishable_...), a mesma do site. NUNCA a secret nem a service_role.
const SUPABASE_URL = "https://pqmyrtywtgukcdmkzuax.supabase.co";
const SUPABASE_KEY = "sb_publishable_UA0xjaueCE3NKpn4Nr_B_A_ES_RvK-w";

(function guard(){
  let bad = SUPABASE_KEY.startsWith("sb_secret_");
  try{ if(SUPABASE_KEY.startsWith("eyJ")) bad = JSON.parse(atob(SUPABASE_KEY.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role === "service_role"; }catch{}
  if(bad){ document.body.innerHTML = "<p style='padding:24px;font-family:sans-serif'>Chave secreta detectada. Use a chave publicável.</p>"; throw new Error("chave secreta no código"); }
})();
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const TAGS = {admin:["ADM","#ff5c7a"], mod:["MOD","#4cd9a0"], vip:["VIP","#b48cff"], donor:["DOADOR","#f4b531"], founder:["FUNDADOR","#ff9f43"]};
let me, tags = {}, entered = false, tab = "users", editing = null;
const el = (tag, text, cls) => Object.assign(document.createElement(tag), {textContent: text || "", className: cls || ""});
const say = (t, ok) => { const e = $("perr"); e.className = "err" + (ok ? " ok" : ""); e.textContent = t; if(ok) setTimeout(() => { if(e.textContent === t) e.textContent = ""; }, 3000); };
const btn = (text, color, fn, cls) => { const b = el("button", text, "chip " + (cls || "act")); b.type = "button"; b.style.setProperty("--c", color); b.onclick = fn; return b; };

$("go").onclick = async () => {
  $("lerr").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email: $("email").value.trim(), password: $("pass").value});
  if(error) $("lerr").textContent = "E-mail ou senha incorretos.";
};
$("out").onclick = $("out2").onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_e, s) => { if(s){ me = s.user; enter(); } else { location.reload(); } });

async function loadTags(){
  const {data} = await sb.from("user_tags").select("*"); tags = {};
  (data || []).forEach(t => (tags[t.user_id] ||= new Set()).add(t.tag));
}
async function enter(){
  if(entered) return; entered = true;
  $("login").classList.add("hide"); await loadTags();
  // a tela só abre para ADM; quem protege de verdade é o banco
  if(!tags[me.id] || !tags[me.id].has("admin")) return $("denied").classList.remove("hide");
  $("panel").classList.remove("hide"); refresh();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  tab = b.dataset.t; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("search").classList.toggle("hide", tab !== "users"); say(""); refresh();
});
function refresh(){ ({users: loadUsers, groups: loadGroups, chat: loadChat, news: loadNews})[tab](); }
const empty = box => box.append(el("p", "Nada por aqui.", "hint"));
const avatar = p => { const a = el("div", "", "av"); if(p.avatar_url){ const i = document.createElement("img"); i.src = p.avatar_url; i.alt = ""; a.append(i); } else a.textContent = (p.username || "?")[0].toUpperCase(); return a; };

// ----- pessoas -----
async function loadUsers(){
  const q = $("search").value.trim();
  let req = sb.from("profiles").select("id,username,avatar_url,bio,status,created_at").order("created_at",{ascending:false}).limit(100);
  if(q) req = req.ilike("username", "%" + q + "%");
  const {data} = await req, box = $("list"); box.innerHTML = "";
  if(!data || !data.length) return empty(box);
  data.forEach(p => box.append(userRow(p)));
}
function userRow(p){
  const r = el("div", "", "item"), nm = el("div", "", "nm"), chips = el("div", "", "chips");
  nm.append(el("b", p.username), el("small", p.status || p.bio || ""));
  Object.keys(TAGS).forEach(t => {
    const on = !!(tags[p.id] && tags[p.id].has(t)), b = el("button", TAGS[t][0], "chip"); b.type = "button";
    b.style.setProperty("--c", TAGS[t][1]); b.setAttribute("aria-pressed", on); b.onclick = () => toggle(p, t, on); chips.append(b);
  });
  chips.append(btn("Editar", "#5aa9ff", () => openEdit(p)), btn("Excluir conta", "#ff6b9a", () => delUser(p)));
  r.append(avatar(p), nm, chips); return r;
}
async function toggle(p, t, on){
  if(on && p.id === me.id && t === "admin") return say("Você não pode tirar a sua própria tag de ADM.");
  const r = on ? await sb.from("user_tags").delete().eq("user_id", p.id).eq("tag", t) : await sb.from("user_tags").insert({user_id: p.id, tag: t});
  if(r.error) return say("Não foi possível salvar a tag.");
  await loadTags(); loadUsers();
}
function openEdit(p){
  editing = p; $("edtitle").textContent = "Editar " + p.username; $("ederr").textContent = "";
  $("edname").value = p.username; $("edstatus").value = p.status || ""; $("edbio").value = p.bio || "";
  $("eddrop").checked = $("edstyle").checked = false; $("edlg").showModal();
}
$("edcancel").onclick = () => $("edlg").close();
$("edsave").onclick = async () => {
  const {error} = await sb.rpc("admin_edit_profile", {uid: editing.id, new_username: $("edname").value.trim(), new_bio: $("edbio").value.trim(),
    new_status: $("edstatus").value.trim(), drop_avatar: $("eddrop").checked, drop_style: $("edstyle").checked});
  if(error){ const m = error.message || ""; return $("ederr").textContent = m.includes("username_invalido") ? "Use 3 a 20 letras, números ou _." : error.code === "23505" ? "Esse nome já está em uso." : "Não foi possível salvar: " + m; }
  $("edlg").close(); say("Perfil atualizado.", true); loadUsers();
};
async function delUser(p){
  if(prompt(`Isso apaga a conta de "${p.username}" e tudo que ela criou, sem volta.\nPara confirmar, digite o nome dela:`) !== p.username) return;
  const {error} = await sb.rpc("admin_delete_user", {uid: p.id});
  if(error) return say(error.message.includes("protegido") ? "Não dá para excluir você mesmo nem outro ADM." : "Não foi possível excluir: " + error.message);
  say("Conta excluída.", true); loadUsers();
}

// ----- grupos (só nome, dono e tamanho; as conversas não aparecem) -----
async function loadGroups(){
  const {data, error} = await sb.rpc("admin_list_groups"), box = $("list"); box.innerHTML = "";
  if(error) return say("Não foi possível listar os grupos.");
  if(!data.length) return empty(box);
  data.forEach(g => {
    const r = el("div", "", "item"), nm = el("div", "", "nm"), chips = el("div", "", "chips");
    nm.append(el("b", (g.is_private ? "🔒 " : "") + g.name), el("small", `dono: ${g.owner} · ${g.members} ${g.members === 1 ? "membro" : "membros"}${g.description ? " · " + g.description : ""}`));
    chips.append(btn("Editar", "#5aa9ff", async () => {
      const name = prompt("Novo nome do grupo:", g.name); if(!name || name.trim().length < 3) return;
      const desc = prompt("Nova descrição:", g.description || "");
      const {error} = await sb.rpc("admin_edit_group", {gid: g.id, new_name: name.trim(), new_desc: (desc || "").trim()});
      error ? say("Não foi possível editar o grupo.") : (say("Grupo atualizado.", true), loadGroups());
    }), btn("Excluir", "#ff6b9a", async () => {
      if(!confirm(`Excluir o grupo "${g.name}" com todas as mensagens e membros? Não tem volta.`)) return;
      const {error} = await sb.rpc("admin_delete_group", {gid: g.id});
      error ? say("Não foi possível excluir o grupo.") : (say("Grupo excluído.", true), loadGroups());
    }));
    r.append(nm, chips); box.append(r);
  });
}

// ----- chat global: apagar mensagens -----
async function loadChat(){
  const {data} = await sb.from("messages").select("id,content,created_at,user_id").order("created_at",{ascending:false}).limit(60), box = $("list"); box.innerHTML = "";
  if(!data || !data.length) return empty(box);
  const {data: ps} = await sb.from("profiles").select("id,username").in("id", [...new Set(data.map(m => m.user_id))]);
  const names = Object.fromEntries((ps || []).map(p => [p.id, p.username]));
  data.forEach(m => {
    const r = el("div", "", "item"), nm = el("div", "", "nm");
    nm.append(el("b", names[m.user_id] || "?"), el("small", new Date(m.created_at).toLocaleString("pt-BR")), el("div", m.content));
    r.append(nm, btn("Apagar", "#ff6b9a", async () => {
      const {error} = await sb.rpc("admin_delete_message", {mid: m.id});
      error ? say("Não foi possível apagar.") : (say("Mensagem apagada.", true), loadChat());
    }));
    box.append(r);
  });
}
// ----- anúncios (canal oficial só de leitura; o bot do futuro também vai postar aqui) -----
async function loadNews(){
  const box = $("list"); box.innerHTML = "";
  const ta = el("textarea"); ta.rows = 3; ta.maxLength = 2000; ta.placeholder = "Escreva um anúncio oficial. Ele aparece no canal 📢 Anúncios, só para leitura."; ta.style.marginTop = "8px";
  const send = el("button", "Publicar anúncio"); send.style.marginTop = "8px";
  send.onclick = async () => {
    const content = ta.value.trim(); if(!content) return;
    const {error} = await sb.from("announcements").insert({content});
    error ? say("Não foi possível publicar.") : (say("Anúncio publicado.", true), loadNews());
  };
  box.append(ta, send);
  const {data} = await sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(30);
  (data || []).forEach(a => {
    const r = el("div", "", "item"), nm = el("div", "", "nm"); nm.append(el("small", new Date(a.created_at).toLocaleString("pt-BR")), el("div", a.content));
    r.append(nm, btn("Apagar", "#ff6b9a", async () => {
      const {error} = await sb.from("announcements").delete().eq("id", a.id); error ? say("Não foi possível apagar.") : loadNews();
    })); box.append(r);
  });
}
let st; $("search").oninput = () => { clearTimeout(st); st = setTimeout(loadUsers, 250); };
</script>
</body>
</html>
