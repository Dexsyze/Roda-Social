<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Roda</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090f;--side:#0d0d16;--panel:#13131f;--ink:#ececf8;--muted:#8a8aaa;--brand:#8b73ff;--on:#fff;--line:#23233a;--mine:#211e47;--bad:#ff6b9a;--ok:#4cd9a0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--side)}
input:disabled{opacity:.55}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:var(--on);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hide{display:none!important}
.err{color:var(--bad);min-height:1.3em;margin:6px 0}.err.ok{color:var(--ok)}
.hint{color:var(--muted);font-size:.86rem;margin:4px 0 0}
#auth{margin:12vh auto 0;width:min(380px,92%);background:var(--panel);padding:26px;border-radius:16px;border:1px solid var(--line)}
#auth h1{margin:0 0 4px;font-size:2rem}#auth p{margin:0 0 14px;color:var(--muted)}#auth input{margin-bottom:10px}
#app{height:100%;display:flex}
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:4px;overflow-y:auto;flex-shrink:0}
.brand{font-weight:800;font-size:1.4rem;padding:4px 8px 8px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;object-fit:cover}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:7px 10px;font-weight:500}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav[aria-current="true"]{background:var(--mine);font-weight:700}
.rw{display:flex;align-items:center;gap:4px}.rw .nav{flex:1;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;font-weight:700;padding:12px 8px 2px}
.mini{padding:2px 10px;font-size:1.05rem;line-height:1.4}
#side input{padding:8px 10px;margin:2px 0 4px}
.col{display:flex;flex-direction:column;gap:2px}
.card{margin-top:auto;display:flex;gap:10px;align-items:center;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:8px;text-align:left;width:100%}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
#head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#head b{font-size:1.05rem}#sub{color:var(--muted);margin-right:auto}
#head button{padding:6px 12px}
#menu{display:none}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:32ch}
.msg{display:flex;gap:10px;max-width:780px}
.msg .b{background:var(--panel);padding:8px 12px;border-radius:14px;border:1px solid var(--line);min-width:0}
.msg.me .b{background:var(--mine)}
.msg small{color:var(--muted);margin-left:8px}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.nm{display:inline-flex;align-items:center;flex-wrap:wrap}
.tag{font-size:.64rem;font-weight:800;padding:1px 6px;border-radius:6px;border:1px solid currentColor;margin-left:6px;letter-spacing:.03em}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--on);display:grid;place-items:center;font-weight:700;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
form.send{display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
#profile{flex:1;overflow-y:auto;padding:24px 16px}
.pbox{max-width:500px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.pbox h2{margin:0 0 4px;display:flex;align-items:center;flex-wrap:wrap}.pbox .av{width:96px;height:96px;font-size:2.2rem;cursor:pointer}
.top{display:flex;gap:16px;align-items:center;margin-bottom:6px}
label{display:block;font-weight:600;margin:14px 0 4px}
.sec{margin:20px 0 0;padding-top:4px;border-top:1px solid var(--line);font-weight:800}
#swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--brand)}
input[type=color]{width:46px;height:34px;padding:2px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);width:min(430px,92%)}
dialog::backdrop{background:rgba(0,0,5,.7)}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.adr{padding:4px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:1}
@media (max-width:720px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;width:84%}
#side.open{transform:none}#menu{display:block}}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>

<div id="auth">
  <img class="logo" src="logo.png" alt="" style="width:56px;height:56px;border-radius:14px;margin-bottom:10px" onerror="this.remove()">
  <h1>Roda</h1>
  <p>Converse com gente do mundo todo.</p>
  <input id="username" class="hide" placeholder="Nome de usuário (3 a 20 letras, números ou _)" maxlength="20" autocomplete="username">
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pass" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
  <p class="err" id="autherr" role="alert"></p>
  <button id="go" style="width:100%">Entrar</button>
  <button id="swap" class="ghost" style="width:100%;margin-top:8px">Criar uma conta</button>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><img class="logo" src="logo.png" alt="" onerror="this.remove()">Roda</div>
    <button class="nav" id="nGlobal"># Chat global</button>
    <div class="sh">Amigos</div><div class="col" id="flist"></div>
    <div class="sh">Grupos <span><button class="mini ghost" id="joing" aria-label="Entrar com convite" title="Entrar com convite">↗</button> <button class="mini ghost" id="newg" aria-label="Criar grupo" title="Criar grupo">+</button></span></div>
    <div class="col" id="glist"></div>
    <div class="sh">Pessoas</div>
    <input id="search" placeholder="Buscar pessoas" aria-label="Buscar pessoas">
    <div class="col" id="ulist"></div>
    <button class="nav" id="inviteSite" style="margin-top:auto">Convidar amigos para a Roda</button>
    <button class="card" id="meBtn" style="margin-top:6px" aria-label="Editar meu perfil"></button>
  </aside>

  <main>
    <div id="chat">
      <div id="head">
        <button id="menu" class="ghost mini" aria-label="Abrir menu">☰</button>
        <b id="title"></b><span id="sub"></span>
        <button id="join" class="hide">Entrar no grupo</button>
        <button id="invite" class="ghost hide">Copiar link de convite</button>
        <button id="reset" class="ghost hide">Novo link</button>
        <button id="gedit" class="ghost hide">Editar grupo</button>
        <button id="gdel" class="ghost hide">Excluir grupo</button>
        <button id="leave" class="ghost hide">Sair do grupo</button>
      </div>
      <div class="feed" id="feed"></div>
      <form class="send" id="form"><input id="inp" placeholder="Escreva uma mensagem" maxlength="1000" autocomplete="off"><button>Enviar</button></form>
    </div>

    <div id="profile" class="hide">
      <div class="pbox">
        <div class="top"><div class="av" id="pav" title="Trocar foto" tabindex="0" role="button" aria-label="Trocar foto"></div>
          <div><h2 id="phead"></h2><div class="hint" id="page"></div></div></div>
        <input type="file" id="file" accept="image/*" class="hide">
        <button class="ghost" id="pick" style="margin-top:8px">Escolher nova foto</button>
        <label for="pname">Nome de usuário</label><input id="pname" maxlength="20">
        <p class="hint" id="nhint"></p>
        <label for="pstatus">Status</label><input id="pstatus" maxlength="60" placeholder="O que você está fazendo?">
        <label for="pbio">Bio</label><textarea id="pbio" rows="3" maxlength="200" placeholder="Fale um pouco sobre você"></textarea>
        <label for="pbirth">Data de nascimento</label><input id="pbirth" type="date">
        <p class="hint" id="bhint"></p>
        <div class="sec">Personalização</div>
        <label>Cor do nome</label>
        <div id="swatches"></div>
        <label for="pcolor">Cor livre</label><input type="color" id="pcolor" value="#8b73ff">
        <p class="hint" id="chint"></p>
        <p class="err" id="perr" role="alert"></p>
        <div class="row"><button id="psave">Salvar perfil</button><button id="out" class="ghost">Sair da conta</button></div>
      </div>
    </div>
  </main>
</div>

<dialog id="gdlg">
  <h2 style="margin-top:0" id="gtitle">Criar grupo</h2>
  <label for="gname">Nome do grupo</label><input id="gname" maxlength="30">
  <label for="gdesc">Descrição (opcional)</label><input id="gdesc" maxlength="150">
  <label class="chk" style="margin-top:14px"><input type="checkbox" id="gpriv"> Grupo privado (só entra com convite ou link)</label>
  <p class="err" id="gerr" role="alert"></p>
  <div class="row"><button class="ghost" id="gcancel">Cancelar</button><button id="gok">Criar</button></div>
</dialog>

<dialog id="jdlg">
  <h2 style="margin-top:0">Entrar com convite</h2>
  <label for="jcode">Cole o link ou o código</label><input id="jcode" autocomplete="off">
  <p class="err" id="jerr" role="alert"></p>
  <div class="row"><button class="ghost" id="jcancel">Cancelar</button><button id="jok">Entrar</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Cole a chave ANON (pública) do Supabase aqui. Nunca use a service_role.
const SUPABASE_URL = "https://pqmyrtywtgukcdmkzuax.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbXlydHl3dGd1a2NkbWt6dWF4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjM2MTAxNywiZXhwIjoyMTA3OTM3MDE3fQ.M6XJ8hstRY-etmkdpdGZjgd2MMIN36Wy5jEWgL1Up0A";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const COLS = "id,username,bio,avatar_url,created_at,name_changed_at,accent,status";
const GCOLS = "id,name,description,owner_id,created_at,is_private";
const TAGS = {admin:["ADM","#ff5c7a"], mod:["MOD","#4cd9a0"], vip:["VIP","#b48cff"], donor:["DOADOR","#f4b531"]};
const ORDER = ["admin","mod","vip","donor"], FREE = ["#8b73ff","#4cd9a0","#5aa9ff","#ff8a5b"], WEEK = 7 * 864e5;
let me, myProf, signup = false, started = false, ctx = {type:"global"}, tok = 0, accentSel = null, myBirth = null;
let groups = [], myGroups = new Set(), users = [], fr = {}, tags = {};
const cache = {}, seen = new Set();

const el = (tag, text, cls) => Object.assign(document.createElement(tag), {textContent: text || "", className: cls || ""});
const toast = t => { const d = $("toast"); d.textContent = t; d.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => d.classList.remove("on"), 2800); };
async function getProf(id){
  if(cache[id]) return cache[id];
  const {data} = await sb.from("profiles").select(COLS).eq("id", id).single();
  return cache[id] = data || {id, username:"?"};
}
function avatar(p){
  const d = el("div", "", "av");
  if(p.avatar_url){const i = document.createElement("img"); i.src = p.avatar_url; i.alt = ""; d.append(i)}
  else d.textContent = (p.username || "?")[0].toUpperCase();
  return d;
}
function nameEl(p){
  const w = el("span", "", "nm"), s = el("strong", p.username);
  if(/^#[0-9a-f]{6}$/i.test(p.accent || "")) s.style.color = p.accent;
  w.append(s);
  (tags[p.id] || []).forEach(t => { const x = el("span", TAGS[t][0], "tag"); x.style.color = TAGS[t][1]; w.append(x); });
  return w;
}
async function loadTags(){
  const {data} = await sb.from("user_tags").select("*"); tags = {};
  (data || []).forEach(t => (tags[t.user_id] ||= []).push(t.tag));
  for(const k in tags) tags[k].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
}
const hasTag = (...l) => (tags[me.id] || []).some(t => l.includes(t));
const closeSide = () => $("side").classList.remove("open");
function show(v){ $("chat").classList.toggle("hide", v !== "chat"); $("profile").classList.toggle("hide", v !== "profile"); }
function mark(btn){ document.querySelectorAll(".nav").forEach(x => x.removeAttribute("aria-current")); if(btn) btn.setAttribute("aria-current","true"); }
const act = (text, label, fn) => { const b = el("button", text, "mini ghost"); b.type = "button"; b.title = b.ariaLabel = label; b.onclick = fn; return b; };
function navRow(p, onClick, ...btns){
  const r = el("div", "", "rw"), b = el("button", "", "nav"); b.type = "button";
  b.append(avatar(p), el("span", p.username)); b.onclick = () => onClick(b); r.append(b, ...btns); return r;
}

// ---------- login ----------
$("swap").onclick = () => {
  signup = !signup;
  $("username").classList.toggle("hide", !signup);
  $("go").textContent = signup ? "Criar conta" : "Entrar";
  $("swap").textContent = signup ? "Já tenho conta" : "Criar uma conta";
  $("autherr").textContent = "";
};
$("go").onclick = async () => {
  const email = $("email").value.trim(), password = $("pass").value, username = $("username").value.trim();
  $("autherr").textContent = "";
  if(signup && !/^[A-Za-z0-9_]{3,20}$/.test(username)) return $("autherr").textContent = "Use de 3 a 20 letras, números ou _ no nome de usuário.";
  const r = signup ? await sb.auth.signUp({email, password, options:{data:{username}}})
                   : await sb.auth.signInWithPassword({email, password});
  if(r.error) return $("autherr").textContent = signup ? "Não foi possível criar a conta. O nome de usuário ou e-mail pode já estar em uso." : "E-mail ou senha incorretos.";
  if(signup && !r.data.session) $("autherr").textContent = "Conta criada! Confirme seu e-mail e depois entre.";
};
$("out").onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_e, s) => { if(s){me = s.user; start()} else if(started){location.reload()} });

async function start(){
  if(started) return; started = true;
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  myProf = await getProf(me.id); await loadTags(); drawMe();
  await Promise.all([loadGroups(), loadFriends(), loadUsers("")]);
  const inv = new URLSearchParams(location.search).get("convite");
  if(!(inv && await useInvite(inv.toLowerCase()))) openGlobal();
  const rt = (table, match) => sb.channel(table).on("postgres_changes",{event:"INSERT",schema:"public",table}, e => { if(match(e.new)) addMsg(e.new, table) }).subscribe();
  rt("messages", () => ctx.type === "global");
  rt("group_messages", m => ctx.type === "group" && m.group_id === ctx.id);
  rt("dms", m => ctx.type === "dm" && (m.sender_id === ctx.id || m.receiver_id === ctx.id));
  setInterval(async () => { await loadTags(); await loadFriends(); drawUsers(); }, 30000);
}
function drawMe(){
  const b = $("meBtn"); b.innerHTML = ""; const w = el("div");
  w.append(nameEl(myProf), el("div", "Editar perfil", "hint")); b.append(avatar(myProf), w);
}

// ---------- mensagens ----------
async function addMsg(m, table){
  const key = table + m.id; if(seen.has(key)) return; seen.add(key);
  const p = await getProf(m.sender_id || m.user_id);
  const row = el("div", "", "msg" + (p.id === me.id ? " me" : "")), b = el("div", "", "b"), h = el("div");
  h.append(nameEl(p), el("small", new Date(m.created_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})));
  b.append(h, el("p", m.content)); row.append(avatar(p), b);
  const f = $("feed"); f.querySelector(".empty")?.remove(); f.append(row); f.scrollTop = f.scrollHeight;
}
async function openCtx(c, title, sub, btn){
  const t = ++tok; ctx = c; seen.clear(); show("chat"); mark(btn); closeSide();
  $("title").replaceChildren(title instanceof Node ? title : document.createTextNode(title));
  $("sub").textContent = sub || ""; $("feed").innerHTML = "";
  const isG = c.type === "group", member = !isG || myGroups.has(c.id), priv = isG && c.g.is_private;
  $("form").classList.toggle("hide", !member);
  $("join").classList.toggle("hide", member);
  const owner = isG && c.g.owner_id === me.id;
  $("leave").classList.toggle("hide", !(isG && member) || owner);
  $("gedit").classList.toggle("hide", !owner);
  $("gdel").classList.toggle("hide", !owner);
  $("invite").classList.toggle("hide", !(priv && member));
  $("reset").classList.toggle("hide", !(priv && member && c.g.owner_id === me.id));
  if(!member) return $("feed").append(el("div", "Entre no grupo para ver e enviar mensagens.", "empty"));
  let q, table;
  if(c.type === "global"){table = "messages"; q = sb.from(table).select("*")}
  else if(isG){table = "group_messages"; q = sb.from(table).select("*").eq("group_id", c.id)}
  else {table = "dms"; q = sb.from(table).select("*").or(`and(sender_id.eq.${me.id},receiver_id.eq.${c.id}),and(sender_id.eq.${c.id},receiver_id.eq.${me.id})`)}
  const {data} = await q.order("created_at",{ascending:false}).limit(60);
  if(t !== tok) return;
  if(!data || !data.length) $("feed").append(el("div", "Ainda não tem mensagens. Que tal começar a conversa?", "empty"));
  for(const m of (data || []).reverse()){ if(t !== tok) return; await addMsg(m, table); }
}
function openGlobal(){ openCtx({type:"global"}, "# Chat global", "todo mundo conversa aqui", $("nGlobal")); }
async function openDm(p, btn){
  const {data: age} = await sb.rpc("age_of", {p: p.id});
  openCtx({type:"dm", id: p.id}, nameEl(p), [age ? age + " anos" : "", p.status || p.bio || ""].filter(Boolean).join(" · "), btn);
}
$("nGlobal").onclick = openGlobal;
$("menu").onclick = () => $("side").classList.add("open");
$("form").onsubmit = async e => {
  e.preventDefault(); const content = $("inp").value.trim(); if(!content) return; $("inp").value = "";
  let r;
  if(ctx.type === "global") r = await sb.from("messages").insert({user_id: me.id, content});
  else if(ctx.type === "group") r = await sb.from("group_messages").insert({group_id: ctx.id, user_id: me.id, content});
  else r = await sb.from("dms").insert({sender_id: me.id, receiver_id: ctx.id, content});
  if(r.error) $("inp").value = content;
};

// ---------- pessoas e amigos ----------
async function loadUsers(q){
  let req = sb.from("profiles").select(COLS).neq("id", me.id).order("created_at",{ascending:false}).limit(40);
  if(q) req = req.ilike("username", "%" + q + "%");
  const {data} = await req; users = data || []; users.forEach(p => cache[p.id] = p); drawUsers();
}
function drawUsers(){
  const box = $("ulist"); box.innerHTML = "";
  users.forEach(p => {
    const f = fr[p.id], extra = [];
    if(!f) extra.push(act("+", "Adicionar aos amigos", () => addFriend(p.id)));
    else if(f.status === "pending") extra.push(el("small", f.incoming ? "pediu" : "enviado", "hint"));
    box.append(navRow(p, b => openDm(p, b), ...extra));
  });
}
let st; $("search").oninput = e => { clearTimeout(st); st = setTimeout(() => loadUsers(e.target.value.trim()), 250); };
async function loadFriends(){
  const {data} = await sb.from("friendships").select("*"); fr = {};
  (data || []).forEach(f => { const o = f.requester_id === me.id ? f.addressee_id : f.requester_id;
    fr[o] = {id: f.id, status: f.status, incoming: f.addressee_id === me.id}; });
  await Promise.all(Object.keys(fr).map(getProf)); drawFriends();
}
function drawFriends(){
  const box = $("flist"), ids = Object.keys(fr); box.innerHTML = "";
  const inc = ids.filter(i => fr[i].status === "pending" && fr[i].incoming), ok = ids.filter(i => fr[i].status === "accepted");
  if(!inc.length && !ok.length) return box.append(el("div", "Adicione pessoas com o + na lista de Pessoas.", "hint"));
  inc.forEach(i => box.append(navRow(cache[i], b => openDm(cache[i], b),
    act("✓", "Aceitar pedido", () => friendOp(i, "accept")), act("✗", "Recusar pedido", () => friendOp(i, "remove")))));
  ok.forEach(i => box.append(navRow(cache[i], b => openDm(cache[i], b),
    act("×", "Desfazer amizade", () => { if(confirm("Desfazer amizade com " + cache[i].username + "?")) friendOp(i, "remove"); }))));
}
async function addFriend(id){
  const {error} = await sb.from("friendships").insert({requester_id: me.id, addressee_id: id});
  if(error) return toast("Não foi possível enviar o pedido.");
  toast("Pedido de amizade enviado."); await loadFriends(); drawUsers();
}
async function friendOp(id, op){
  const q = sb.from("friendships");
  await (op === "accept" ? q.update({status:"accepted"}).eq("id", fr[id].id) : q.delete().eq("id", fr[id].id));
  await loadFriends(); drawUsers();
}

// ---------- grupos ----------
async function loadGroups(){
  const [g, m] = await Promise.all([
    sb.from("groups").select(GCOLS).order("created_at",{ascending:false}).limit(60),
    sb.from("group_members").select("group_id").eq("user_id", me.id)]);
  groups = g.data || []; myGroups = new Set((m.data || []).map(x => x.group_id)); drawGroups();
}
function openGroup(g, btn){ openCtx({type:"group", id: g.id, g}, g.name, (g.description || "") + (g.is_private ? (g.description ? " · " : "") + "grupo privado" : ""), btn); }
function drawGroups(){
  const box = $("glist"); box.innerHTML = "";
  if(!groups.length) box.append(el("div", "Nenhum grupo ainda. Crie o primeiro!", "hint"));
  [...groups].sort((a, b) => myGroups.has(b.id) - myGroups.has(a.id)).forEach(g => {
    const b = el("button", "", "nav"); b.type = "button"; b.append(el("span", (g.is_private ? "🔒 " : "") + g.name));
    if(!myGroups.has(g.id)) b.append(el("small", "entrar", "hint"));
    b.onclick = () => openGroup(g, b); box.append(b);
  });
}
let editing = null;
function openGroupDlg(g){
  editing = g; $("gerr").textContent = "";
  $("gtitle").textContent = g ? "Editar grupo" : "Criar grupo"; $("gok").textContent = g ? "Salvar" : "Criar";
  $("gname").value = g ? g.name : ""; $("gdesc").value = g ? g.description : ""; $("gpriv").checked = g ? g.is_private : false;
  $("gdlg").showModal();
}
$("newg").onclick = () => openGroupDlg(null);
$("gedit").onclick = () => openGroupDlg(ctx.g);
$("gdel").onclick = async () => {
  if(!confirm('Excluir o grupo "' + ctx.g.name + '"? As mensagens e os membros serão apagados e isso não tem volta.')) return;
  const {error} = await sb.from("groups").delete().eq("id", ctx.id);
  if(error) return toast("Não foi possível excluir o grupo.");
  await loadGroups(); openGlobal(); toast("Grupo excluído.");
};
$("gcancel").onclick = () => $("gdlg").close();
$("gok").onclick = async () => {
  const name = $("gname").value.trim(); if(name.length < 3) return $("gerr").textContent = "O nome precisa ter pelo menos 3 letras.";
  if(editing){
    const {data, error} = await sb.from("groups").update({name, description: $("gdesc").value.trim(), is_private: $("gpriv").checked}).eq("id", editing.id).select(GCOLS).single();
    if(error) return $("gerr").textContent = "Não foi possível salvar o grupo.";
    $("gdlg").close(); await loadGroups(); return openGroup(data);
  }
  const {data, error} = await sb.from("groups").insert({name, description: $("gdesc").value.trim(), owner_id: me.id, is_private: $("gpriv").checked}).select(GCOLS).single();
  if(error) return $("gerr").textContent = "Não foi possível criar o grupo.";
  await sb.from("group_members").insert({group_id: data.id, user_id: me.id});
  $("gdlg").close(); $("gname").value = $("gdesc").value = ""; $("gpriv").checked = false;
  await loadGroups(); openGroup(data);
};
$("join").onclick = async () => {
  const {error} = await sb.from("group_members").insert({group_id: ctx.id, user_id: me.id}); if(error) return toast("Não foi possível entrar.");
  const g = ctx.g; await loadGroups(); openGroup(g);
};
$("leave").onclick = async () => {
  if(!confirm("Sair deste grupo?")) return;
  await sb.from("group_members").delete().eq("group_id", ctx.id).eq("user_id", me.id); await loadGroups(); openGlobal();
};
async function shareLink(code){
  const link = location.origin + location.pathname + "?convite=" + code;
  try{ await navigator.clipboard.writeText(link); toast("Link de convite copiado."); } catch{ prompt("Copie o link de convite:", link); }
}
$("invite").onclick = async () => { const {data} = await sb.rpc("get_invite_code", {gid: ctx.id}); if(data) shareLink(data); else toast("Não foi possível gerar o link."); };
$("reset").onclick = async () => {
  if(!confirm("Gerar um novo link? O link antigo deixa de funcionar.")) return;
  const {data} = await sb.rpc("reset_invite", {gid: ctx.id}); if(data) shareLink(data);
};
async function useInvite(code){
  const {data, error} = await sb.rpc("join_by_code", {code});
  if(error || !data){ toast("Convite inválido ou expirado."); return false; }
  history.replaceState(null, "", location.pathname); await loadGroups();
  const g = groups.find(x => x.id === data); if(g) openGroup(g); return true;
}
$("joing").onclick = () => { $("jerr").textContent = ""; $("jdlg").showModal(); };
$("jcancel").onclick = () => $("jdlg").close();
$("jok").onclick = async () => {
  const raw = $("jcode").value.trim(), m = raw.match(/convite=([a-z0-9]+)/i), code = (m ? m[1] : raw).toLowerCase(); if(!code) return;
  if(await useInvite(code)){ $("jdlg").close(); $("jcode").value = ""; } else $("jerr").textContent = "Convite inválido ou expirado.";
};

// ---------- convidar amigos para o site ----------
$("inviteSite").onclick = async () => {
  const url = location.origin + location.pathname, text = "Vem conversar comigo na Roda!";
  if(navigator.share){ try{ await navigator.share({title:"Roda", text, url}); return; } catch(e){ if(e.name === "AbortError") return; } }
  try{ await navigator.clipboard.writeText(url); toast("Link do site copiado. É só mandar para seus amigos."); } catch{ prompt("Copie o link do site:", url); }
};

// ---------- perfil ----------
$("meBtn").onclick = async () => {
  show("profile"); mark(null); closeSide(); $("perr").textContent = "";
  const {data} = await sb.rpc("my_birthdate"); myBirth = data; drawProfile();
};
function drawSwatches(){
  const box = $("swatches"); box.innerHTML = "";
  [null, ...FREE].forEach(c => {
    const b = el("button", "", "sw" + (c === accentSel ? " on" : "")); b.type = "button";
    b.style.background = c || "var(--ink)"; b.ariaLabel = c ? "Cor " + c : "Cor padrão"; b.onclick = () => { accentSel = c; drawSwatches(); }; box.append(b);
  });
  const prem = hasTag("admin","donor","vip"); $("pcolor").disabled = !prem;
  if(accentSel) $("pcolor").value = accentSel;
  $("chint").textContent = prem ? "Como doador, você pode usar qualquer cor." : "Cor livre é exclusiva para doadores e VIPs.";
  const pv = $("phead").querySelector("strong"); if(pv) pv.style.color = accentSel || "";
}
$("pcolor").oninput = e => { accentSel = e.target.value; drawSwatches(); };
function drawProfile(){
  $("pav").replaceChildren(...avatar(myProf).childNodes);
  $("phead").replaceChildren(nameEl(myProf));
  $("page").textContent = myBirth ? Math.floor((Date.now() - new Date(myBirth)) / 31557600000) + " anos" : "Idade não informada";
  $("pname").value = myProf.username; $("pbio").value = myProf.bio || ""; $("pstatus").value = myProf.status || "";
  const left = myProf.name_changed_at ? WEEK - (Date.now() - new Date(myProf.name_changed_at)) : 0, days = Math.ceil(left / 864e5);
  $("pname").disabled = left > 0;
  $("nhint").textContent = left > 0 ? `Você poderá trocar o nome em ${days} ${days === 1 ? "dia" : "dias"}. A troca antecipada paga ainda não está disponível.` : "Você pode trocar o nome de usuário a cada 7 dias.";
  $("pbirth").value = myBirth || ""; $("pbirth").disabled = !!myBirth;
  $("bhint").textContent = myBirth ? "A data de nascimento não pode ser alterada. Só a sua idade aparece para os outros." : "Só a sua idade aparece para os outros. É preciso ter 13 anos ou mais e não dá para mudar depois.";
  accentSel = myProf.accent || null; drawSwatches();
}
$("pick").onclick = () => $("file").click();
$("pav").onclick = () => $("file").click();
$("pav").onkeydown = e => { if(e.key === "Enter" || e.key === " ") $("file").click(); };
$("file").onchange = () => { const f = $("file").files[0]; if(f){ $("perr").className = "err ok"; $("perr").textContent = "Foto escolhida: " + f.name + ". Clique em Salvar perfil."; } };
$("psave").onclick = async () => {
  const perr = $("perr"); perr.className = "err"; perr.textContent = "";
  const upd = {bio: $("pbio").value.trim(), status: $("pstatus").value.trim() || null}, name = $("pname").value.trim();
  if(!$("pname").disabled && name !== myProf.username){
    if(!/^[A-Za-z0-9_]{3,20}$/.test(name)) return perr.textContent = "Use de 3 a 20 letras, números ou _ no nome.";
    upd.username = name;
  }
  if(accentSel !== (myProf.accent || null)) upd.accent = accentSel;
  if(!$("pbirth").disabled && $("pbirth").value) upd.birthdate = $("pbirth").value;
  const f = $("file").files[0];
  if(f){
    if(!f.type.startsWith("image/") || f.size > 2e6) return perr.textContent = "Escolha uma imagem de até 2 MB.";
    const up = await sb.storage.from("avatars").upload(me.id + "/avatar", f, {upsert:true, contentType:f.type});
    if(up.error) return perr.textContent = "Não foi possível enviar a foto.";
    upd.avatar_url = sb.storage.from("avatars").getPublicUrl(me.id + "/avatar").data.publicUrl + "?t=" + Date.now();
  }
  const {error} = await sb.from("profiles").update(upd).eq("id", me.id);
  if(error){
    const m = error.message || "";
    return perr.textContent = m.includes("name_locked") ? "Você já trocou o nome esta semana." :
      m.includes("idade_minima") ? "É preciso ter 13 anos ou mais para usar a Roda." :
      m.includes("birthdate_locked") ? "A data de nascimento não pode ser alterada." :
      m.includes("premium_only") ? "Cor livre é exclusiva para doadores e VIPs." :
      error.code === "23505" ? "Esse nome de usuário já está em uso." : "Não foi possível salvar.";
  }
  const {data} = await sb.from("profiles").select(COLS).eq("id", me.id).single();
  myProf = cache[me.id] = data; if(upd.birthdate) myBirth = upd.birthdate;
  $("file").value = ""; drawMe(); drawProfile(); perr.className = "err ok"; perr.textContent = "Perfil salvo.";
};
</script>
</body>
